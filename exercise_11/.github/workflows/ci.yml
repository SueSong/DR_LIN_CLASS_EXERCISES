name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend: Lint and Type Check
  frontend-lint-type:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run type check
        run: npm run type-check

  # Frontend: Build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js app
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  # Backend: Lint (if configured)
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy  # Optional: Add if you want linting
      
      - name: Check code formatting (ruff)
        run: ruff check . || echo "Ruff not fully configured, skipping"
        continue-on-error: true
      
      - name: Check type hints (mypy)
        run: mypy . --ignore-missing-imports || echo "MyPy not fully configured, skipping"
        continue-on-error: true

  # Backend: Unit Tests
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short -p no:langsmith
        env:
          # Set required environment variables for tests
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key-for-testing' }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
        continue-on-error: true

  # Frontend: E2E Tests
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    # E2E tests need both frontend and backend running
    services:
      backend:
        image: python:3.12-slim
        ports:
          - 8011:8011
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key-for-testing' }}
        # Note: In real CI, you'd want to build and run your actual backend
        # This is a simplified version
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Start backend (simplified - in real CI, use Docker)
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Start backend in background
          uvicorn app.main:app --host 0.0.0.0 --port 8011 &
          sleep 5
          curl http://localhost:8011/healthz || exit 1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key-for-testing' }}
      
      - name: Build frontend
        run: npm run build
      
      - name: Start frontend
        run: |
          npm start &
          sleep 5
          curl http://localhost:3082 || exit 1
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3082
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Combined: All checks must pass
  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [frontend-lint-type, frontend-build, backend-lint, backend-unit-tests, frontend-e2e]
    if: always()
    
    steps:
      - name: Check all jobs passed
        run: |
          echo "Checking CI job results:"
          echo "  Frontend Lint/Type: ${{ needs.frontend-lint-type.result }}"
          echo "  Frontend Build: ${{ needs.frontend-build.result }}"
          echo "  Backend Lint: ${{ needs.backend-lint.result }}"
          echo "  Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "  Frontend E2E: ${{ needs.frontend-e2e.result }}"
          
          FAILED_JOBS=""
          
          if [ "${{ needs.frontend-lint-type.result }}" != "success" ]; then
            FAILED_JOBS="${FAILED_JOBS} frontend-lint-type"
          fi
          
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            FAILED_JOBS="${FAILED_JOBS} frontend-build"
          fi
          
          if [ "${{ needs.backend-unit-tests.result }}" != "success" ]; then
            FAILED_JOBS="${FAILED_JOBS} backend-unit-tests"
          fi
          
          if [ "${{ needs.frontend-e2e.result }}" != "success" ]; then
            FAILED_JOBS="${FAILED_JOBS} frontend-e2e"
          fi
          
          if [ -n "$FAILED_JOBS" ]; then
            echo "❌ Failed jobs:${FAILED_JOBS}"
            echo "Blocking merge - CI checks must pass!"
            exit 1
          fi
          
          echo "✅ All CI checks passed!"

