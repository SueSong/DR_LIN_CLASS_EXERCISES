[pytest]
# Pytest configuration for prompt snapshot tests

# Disable problematic plugins that cause compatibility issues
# The langsmith plugin has issues with Python 3.12
addopts = -p no:langsmith

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    generate_snapshots: Mark tests that generate snapshot files (use -m generate_snapshots to run)

